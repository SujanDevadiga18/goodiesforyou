<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="500" height="400">
  <defs>
    <linearGradient id="boxTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E5C39E"/>
      <stop offset="100%" stop-color="#D4AE85"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CCA177"/>
      <stop offset="100%" stop-color="#B88A5E"/>
    </linearGradient>
    <linearGradient id="boxSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B28458"/>
      <stop offset="100%" stop-color="#9C7047"/>
    </linearGradient>
    <linearGradient id="tape" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EFE2C6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#DFD0AF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="boxShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="25" stdDeviation="15" flood-color="#3D2B1F" flood-opacity="0.28"/>
    </filter>
  </defs>

  <g filter="url(#boxShadow)">
    <!-- 3D Cardboard Box Main Shape -->
    <!-- Front Face -->
    <polygon points="60,180 440,180 440,350 60,350" fill="url(#boxFront)"/>

    <!-- Top Flap / Top Face -->
    <polygon points="60,180 140,80 480,80 440,180" fill="url(#boxTop)"/>

    <!-- Left/Right Isometric Accents -->
    <polygon points="440,180 480,80 480,240 440,350" fill="url(#boxSide)"/>

    <!-- Center Packaging Tape -->
    <polygon points="230,80 270,80 270,350 230,350" fill="url(#tape)"/>
    <line x1="250" y1="80" x2="250" y2="350" stroke="#B89B6A" stroke-width="1.5" stroke-dasharray="4,2"/>

    <!-- Fragile / Care Stamp on Box -->
    <g transform="translate(90, 220) rotate(-6)" opacity="0.45">
      <rect x="0" y="0" width="100" height="40" rx="4" fill="none" stroke="#68291A" stroke-width="2.5"/>
      <text x="50" y="24" fill="#68291A" font-family="'Courier New', monospace" font-size="14" font-weight="bold" text-anchor="middle">FRAGILE</text>
    </text>
    </g>

    <!-- Handle with Care Stamp -->
    <g transform="translate(310, 240) rotate(4)" opacity="0.35">
      <circle cx="30" cy="30" r="26" fill="none" stroke="#2B2621" stroke-width="2"/>
      <text x="30" y="26" fill="#2B2621" font-family="'Courier New', monospace" font-size="8" font-weight="bold" text-anchor="middle">HANDLE WITH</text>
      <text x="30" y="38" fill="#2B2621" font-family="'Courier New', monospace" font-size="10" font-weight="bold" text-anchor="middle">CARE</text>
    </g>
  </g>
</svg>
